# Production setup on one server: PostgreSQL, the backend, Caddy (serves the frontend, forwards
# /api to the backend, HTTPS) and a daily database backup. Step-by-step guide: DEPLOYMENT.md
#
#   cp .env.example .env                      # docker settings: database password, domain
#   cp backend/.env.example backend/.env      # app settings: LLM, JWT secret, email, admins
#   docker compose up -d --build
name: smart-campus-connect

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: college_ai
      POSTGRES_USER: college_ai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (next to docker-compose.yml)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U college_ai -d college_ai"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      # These win over backend/.env
      DATABASE_URL: postgresql+asyncpg://college_ai:${POSTGRES_PASSWORD}@db:5432/college_ai
      TRUST_PROXY_HEADERS: "true"  # Caddy is in front and passes on the visitor's real IP
      ENABLE_DOCS: ${ENABLE_DOCS:-false}
    volumes:
      - chroma:/app/chroma_db  # the knowledge base
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=10)"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 10m  # the first start indexes the data files

  web:
    build: ./frontend
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"  # HTTP/3
    volumes:
      - caddy_data:/data  # HTTPS certificates
      - caddy_config:/config
    depends_on:
      - backend

  # Daily database dump into ./backups (users, chats, sync history), keeping BACKUP_KEEP_DAYS days.
  # The knowledge base needs no backup: a website sync rebuilds it.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: college_ai
      PGDATABASE: college_ai
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          file=/backups/college_ai-$$(date +%Y-%m-%d).dump
          if pg_dump --format=custom --file="$$file.tmp" && mv "$$file.tmp" "$$file"; then
            echo "Backup written: $$file"
          else
            echo "Backup FAILED"
          fi
          find /backups -name 'college_ai-*.dump' -mtime +$$KEEP_DAYS -delete
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  chroma:
  caddy_data:
  caddy_config:
